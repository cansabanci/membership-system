<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Giriş Yap</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <h2>Giriş Yap</h2>
        <form id="loginForm">
            <input type="email" id="email" placeholder="Kullanıcı adresiniz" required>
            <input type="password" id="password" placeholder="Şifre" required>
            <button type="submit">Giriş</button>
            <div id="loginError" class="error-message">Hatalı kullanıcı adı ya da şifre!</div>
        </form>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
