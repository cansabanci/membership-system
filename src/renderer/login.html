<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Giriş Yap</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-shell">
        <div class="login-brand">
            <img src="../../images/logo.jpg" alt="Mersin ODTÜ Mezunları Derneği">
            <div>
                <h1>Mersin ODTÜ Mezunları Derneği</h1>
                <span>Üye Kayıt Sistemi</span>
            </div>
        </div>

        <div class="login-container">
            <h2>Giriş Yap</h2>
            <p class="sub">Devam etmek için hesap bilgilerinizi girin.</p>
            <form id="loginForm">
                <div class="field">
                    <label for="email">E-posta</label>
                    <input type="email" id="email" placeholder="ornek@mail.com" required>
                </div>
                <div class="field">
                    <label for="password">Şifre</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit">Giriş Yap</button>
                <div id="loginError" class="error-message">Hatalı kullanıcı adı ya da şifre!</div>
            </form>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
